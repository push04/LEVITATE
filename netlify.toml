[build]
  command = "npm run build"
  publish = ".next"

# Use the official Netlify Next.js plugin for serverless
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (set in Netlify dashboard, not here for security)
[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── AUTOMATION FUNCTIONS ──────────────────────────────────────
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduled Functions (all IST times, stored in UTC)
# reporter    → Daily 8:00 AM IST  = 2:30 AM UTC
# bizdev      → Daily 6:00 AM IST  = 12:30 AM UTC
# outreach    → Daily 9:00 AM IST  = 3:30 AM UTC
# followup    → Daily 10:00 AM IST = 4:30 AM UTC
# invoice-check → Daily 9:00 AM IST = 3:30 AM UTC
# retention   → Sunday 9:30 PM IST = Sunday 16:00 UTC
# agent-evaluator → Sunday 11 PM IST = Sunday 17:30 UTC
# kaggle-watchdog → Every 30 minutes
# supabase-heartbeat → Every 5 days

# Background Functions (triggered by webhooks — no schedule)
# discovery-bg   → Triggered by WhatsApp webhook
# proposal-bg    → Triggered by discovery agent
# onboarding-bg  → Triggered by Razorpay webhook
